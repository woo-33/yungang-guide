      {n:"佛衣", x:150,y:195, t:"袈裟的穿法", d:"袈裟是僧人的法衣。多数资料称这尊大佛为袒右肩式(露出右肩)。", m:"袒右肩源自印度,是表示恭敬的礼仪穿法。通肩是两肩都盖住,褒衣博带则是后来受汉地服饰影响的宽衣大袖样式。穿法能帮你判断造像的时代与风格。", l:"看右肩是否露出、衣角从哪里搭过。下方“佛衣三种穿法”有对照。"},
      {n:"禅定印", x:150,y:262, t:"双手置于腹前", d:"双手放在腹前,两手相叠,掌心向上。这是佛教造像中非常常见的一种手印,通常与禅定、静观等意义相关。", m:"象征专注内心、入定修行,与释迦在菩提树下坐禅悟道的情景相关。", l:"此处手部已残损,多数导览称其为禅定印,具体请以现场与权威资料为准。"},
      {n:"结跏趺坐", x:150,y:318, t:"双腿盘起,脚心向上", d:"两腿交叉盘坐,双脚脚掌朝上。", m:"传说释迦成道时就是这样端坐。盘结稳固,象征修行坚定、不动摇,是佛像最庄严的坐姿。对比:17窟弥勒菩萨是交脚坐,还有垂腿而坐的“善跏坐”。", l:"看腿部宽厚的衣摆如何形成稳稳的底座。"},

      {n:"飞天与周边", x:62,y:38, t:"佛旁边的小人物", d:"佛的周围常有小型人物。飞天是飘在空中的天人,衣带飘扬,奏乐、散花、供养佛。", m:"飞天不是“天使”,而是佛教中赞叹、供养佛的天界众生,用来烘托说法时的庄严与热闹。云冈飞天多见于背光上缘、窟顶和壁面上部。大佛两侧原有胁侍立佛,现存东侧一尊。", l:"抬头找飘带与衣袖的流动曲线,再看两侧的陪衬立佛。"}

    {n:"褒衣博带", d:"宽衣大袖,衣带飘垂,层次多。", m:"受汉地服饰影响,多见于云冈后期,体现佛像的汉化。"}

      ["为什么要开凿?","公元446年起,北魏太武帝推行灭佛,寺庙被毁、僧人受难。452年文成帝即位,恢复佛教,僧人昙曜受到重用,任沙门统。据《魏书·释老志》,他请求在京城西的武州塞开凿五所石窟,各雕一尊大佛,这就是昙曜五窟。"],
      ["主像","第16窟主像是立佛,施无畏印,立于莲座之上,周壁雕千佛与佛龛。五窟里立像不多,显得格外高大挺拔。"],
      ["窟形","窟平面接近马蹄形,顶部呈穹隆状。五窟窟形相近,常被解释为模仿草庐或天幕,让巨像占满整个空间。"],

    {no:17, main:"交脚弥勒菩萨", h:"约15.6米", feat:"交脚而坐,菩萨装", story:[

      ["交脚坐的含义","两腿在脚踝处交叉而坐,是云冈弥勒菩萨的常见坐法,常被解释为他正在兜率天宫说法。"],
      ["三世佛","窟内另有坐佛、立佛,一般认为与主像一起构成“三世”(过去、现在、未来)的格局。"],
      ["找找小细节","留意菩萨的宝冠与璎珞,佛座上的莲花,以及高处壁面的飞天。"],
      ["现场怎么看","和第20窟对比:同样巨大,但17窟的主像是菩萨装。看头冠、饰物和坐姿,就能分清佛与菩萨。"]]},
    {no:18, main:"释迦立佛", h:"约15.5米", feat:"佛衣上刻满小佛", story:[

      ["弟子像","窟壁上刻有弟子像围绕主佛,可以顺便练习分辨“佛”和“弟子”。"],
      ["找找小细节","除了千佛,还可找背光上的化佛、火焰纹与飞天。"],
      ["现场怎么看","站在佛脚边仰头,看衣服上小佛的排列。风化重的地方小佛已经模糊,更要靠近细看。"]]},
    {no:19, main:"坐佛", h:"约16.8米", feat:"五窟中主像最高", story:[
      ["最大的一尊","第19窟主像是施无畏印的坐佛,是昙曜五窟中最高的一尊,约16.8米。"],
      ["两个耳洞","主窟左右各有一个较大的侧洞,常称“耳洞”,洞内也有大像,像是主佛两侧的陪衬。"],
      ["找找小细节","两个耳洞与主佛之间,留意胁侍像与壁面上部的飞天、莲花。"],
      ["现场怎么看","和第20窟并排比较:19窟的体量压迫感最强,留意主佛与耳洞之间尺度的落差。"]]},
    {no:20, main:"露天大佛", h:"约14米", feat:"禅定印", go:true}
  ],
  common: [["窟形","平面接近马蹄形,顶部呈穹隆状,常被解释为模仿草庐或天幕。"],["主像","都是体量巨大的佛或菩萨,占满窟内大半空间。"],["风格","宽肩厚体、面相方圆、气势雄浑,是云冈早期风格。"],["装饰","背光与壁面上常见飞天、莲花、火焰纹,多已风化,要仰头细找。"]],
  terms: {
    "飞天":"凌空飞舞的天人,没有翅膀,靠飘带与衣袖表现飞行。他们奏乐、散花,供养并赞叹佛,不是“天使”。多在背光上缘、窟顶、壁面上部。",

    "袒右肩":"露出右肩、衣从左肩搭过的穿法,源自印度,表示恭敬。",

    "禅定印":"双手相叠置于腹前、掌心向上的手印,与禅定、静观相关。",

    "弥勒":"佛教中将在未来降生成佛的菩萨,所以现在是菩萨装。",
    "三世佛":"过去、现在、未来三世的佛,常成组出现。",
    "胁侍":"站在主佛两侧陪衬的像,突出主像的中心地位。",
    "耳洞":"第19窟主窟两侧的大型侧洞,洞内也有大像。",
    "沙门统":"北魏管理佛教事务的僧官。",
    "本生":"讲述佛前世修行故事的内容,常见舍身饲虎、割肉贸鸽等。",
    "佛传":"讲述释迦牟尼一生的故事,可分为入胎、诞生、出家、成道、说法、涅槃等阶段。",

  },

  stories: [
    {n:"佛传:释迦的一生",tag:"连环画",steps:["乘象入胎:摩耶夫人梦见白象入怀,预示圣人降生。","树下诞生:太子悉达多在蓝毗尼园树下诞生,常伴“九龙灌浴”的传说。","四门出游:太子出游,见到老、病、死与出家人,开始思索解脱。","夜半逾城:太子骑白马离宫,出家寻道。","降魔成道:在菩提树下战胜魔军,觉悟成佛。","初转法轮:在鹿野苑首次说法,度化最初的弟子。","涅槃:八十岁时在拘尸那迦圆寂。"],means:"这是佛像“是谁”的答案:他本是一位王子,经历出家与觉悟,成为释迦牟尼佛。",at:"第6窟满壁佛传浮雕,是云冈看佛传最集中的地方。"},
    {n:"舍身饲虎",tag:"本生故事",steps:["释迦的前世是萨埵太子,出游时见到饥饿的母虎和幼虎。","母虎饿得几乎要吃掉自己的孩子。","太子无力救它们,便纵身跳下,以自己的身体喂虎。"],means:"“本生”讲的是佛的前世。这则故事表现舍己救人的慈悲。",at:"云冈部分中期洞窟有本生、因缘故事浮雕,位置请以现场导览为准。"},

const $ = s => document.querySelector(s);
const app = $("#app"), sheet = $("#sheet");
let view = "home", step = 0, picked = null, toast = "";

function go(v){ view=v; step=0; picked=null; closeSheet(); render(); scrollTo(0,0); }
function openSheet(html){ sheet.innerHTML = html; sheet.classList.add("open"); linkTerms(sheet); applyLang(sheet); }
function linkTerms(root){
  const re = new RegExp("("+Object.keys(DATA.terms).sort((a,b)=>b.length-a.length).join("|")+")");
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), ns = [];
  while(w.nextNode()) ns.push(w.currentNode);
  ns.forEach(n=>{
    if(n.parentElement.closest("button,.term") || !re.test(n.nodeValue)) return;
    const f = document.createDocumentFragment();
    n.nodeValue.split(re).forEach((p,i)=>{
      if(i%2){ const e=document.createElement("span"); e.className="term"; e.textContent=p; e.dataset.k=p; e.onclick=ev=>{ev.stopPropagation();tip(e.dataset.k)}; f.append(e); }
      else f.append(p);
    });
    n.replaceWith(f);
  });
}
function tip(k){ const t=$("#tip"); t.innerHTML=`<div class="flex justify-between"><b class="text-xl red">${k}</b><button onclick="$('#tip').style.display='none'" class="sans sub text-xl px-2">✕</button></div><p class="mt-2 leading-relaxed">${DATA.terms[k]}</p>`; t.style.display="block"; applyLang(t); }
function closeSheet(){ sheet.classList.remove("open"); }
const back = () => `<button onclick="go('home')" class="sans sub py-4 text-base">← 返回</button>`;

function render(){
  $("#tip").style.display="none";
  ({home, caves, figures, story, cave20, cave})[view]();
  linkTerms(app); applyLang(app);
}
let lang="cn", conv=null;
function applyLang(root){
  if(lang!=="tw"||!window.OpenCC) return;
  conv=conv||OpenCC.Converter({from:"cn",to:"tw"});
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), ns=[];
  while(w.nextNode()) ns.push(w.currentNode);
  ns.forEach(n=>{ n.nodeValue=conv(n.nodeValue); });
}
function toggleLang(){
  const b=$("#lang");
  if(lang==="cn"&&!window.OpenCC){ b.textContent="暂不可用"; setTimeout(()=>b.textContent="繁體",1800); return; }
  lang=lang==="cn"?"tw":"cn"; b.textContent=lang==="cn"?"繁體":"简体";
  closeSheet(); render();

let cur=16;
function cv(n){ if(n==20) return go('cave20'); cur=n; go('cave'); }
function cave(){
  const c=DATA.all[cur-1], tn=DATA.tanyao.find(x=>x.no==cur), L=LK[cur]||(cur>=21?LKW:[]), Z=DATA.zones.find(z=>cur>=z.r[0]&&cur<=z.r[1]);
  const facts=tn?[["主像",tn.main],["高度",tn.h],["最明显的特点",tn.feat],["期别",c.p]]:[["窟形",SH[c.sh]],["主像",c.main],["数据",c.size],["期别",c.p]].filter(f=>f[1]&&f[1]!=="—");
  const card=(t,b)=>`<div class="card p-5 mt-4"><h3 class="text-xl font-bold">${t}</h3>${b}</div>`;
  const body=tn?tn.story.map(x=>card(x[0],`<p class="mt-2 leading-relaxed">${x[1]}</p>`)).join(""):
    card("概述",`<p class="mt-2 leading-relaxed">${c.note}</p>`)+(L.length?card("看点",`<ul class="mt-2 space-y-2">${L.map(t=>`<li class="flex gap-2 leading-relaxed"><span class="red">◆</span><span>${t}</span></li>`).join("")}</ul>`):"");
  const prev=cur==1?45:cur-1, next=cur==45?1:cur+1;
  app.innerHTML=`<div class="fade"><button onclick="go('caves')" class="sans sub py-4 text-base">← 云冈石窟全览</button>
  <div class="red sans text-sm">${c.z}${tn?" · 昙曜五窟":""}${c.tag&&!tn?" · "+c.tag:""}</div>
  <h2 class="text-4xl font-bold mt-1">第${cur}窟</h2>
  ${fig(cur)}
  <div class="grid grid-cols-2 gap-3 mt-5">${facts.map(f=>`<div class="card p-4"><div class="sans sub text-sm">${f[0]}</div><div class="text-lg font-bold mt-1">${f[1]}</div></div>`).join("")}</div>
  ${body}
  ${card("所在区域 · "+c.z,`<p class="mt-2 leading-relaxed sub">${Z.d}</p>`)}
  ${!c.k&&!tn?'<p class="sans sub text-xs mt-4">该窟的单窟资料较少,先以区域与时期概述为主,之后再补充。</p>':""}
  <div class="flex gap-3 mt-8"><button class="sans card flex-1 py-3" onclick="cv(${prev})">← 第${prev}窟</button><button class="btn flex-1" style="padding:12px 0" onclick="cv(${next})">第${next}窟 →</button></div></div>`;
}
